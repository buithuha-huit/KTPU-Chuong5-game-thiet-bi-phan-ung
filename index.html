<title>Đấu trường Thiết bị</title>

<style>
/* Giao diện sáng, nhiều màu cho máy chiếu: thanh trên (vòng + điểm) · sân khấu · thanh điều khiển. Mỗi vòng một màu chủ đạo (--rc, --rc2). */
:root{
  --bg:#F5F3FF; --stage:#FFFFFF; --ink:#1A1F3A; --ink2:#454B6B; --muted:#6E7391; --line:#DCDDEB; --soft:#EEEDF8;
  --brand:#1B2A6B; --gold:#FACC15; --ok:#16A34A; --ok-bg:#DCFCE7; --bad:#E11D48; --bad-bg:#FFE4E6;
  --t0:#7C3AED; --t1:#0D9488; --t2:#EA580C; --t3:#2563EB;
  --oA:#F43F5E; --oB:#3B82F6; --oC:#F59E0B; --oD:#22C55E;
  --cL:#F26B3A; --cL2:#FFB13B; --cR:#2F7DE1; --cR2:#06B6D4;
  --display:'Lexend','Be Vietnam Pro',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:clamp(15px,1.05vw,20px)/1.5 var(--body);
  background:radial-gradient(1100px 600px at 0% 0%,#FFE4D3 0,transparent 60%),radial-gradient(900px 600px at 100% 0%,#DCE9FF 0,transparent 55%),radial-gradient(1000px 700px at 50% 110%,#E3F9EC 0,transparent 60%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
mjx-container{color:inherit}
.app{max-width:1640px;margin:0 auto;padding-block:12px 18px;display:flex;flex-direction:column;gap:12px;min-height:100%}

/* thanh trên */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:linear-gradient(110deg,#1B2A6B,#4B2A8C 55%,#9D2C7A);color:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px #4B2A8C33}
.logo{font-family:var(--display);font-weight:900;font-size:1.25em;white-space:nowrap}
.logo small{display:block;font:600 .6em/1.2 var(--body);opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:rgba(255,255,255,.08);color:#E4E6F7;border-radius:12px;padding:6px 11px;font-weight:700;font-size:.86em;display:flex;gap:6px;align-items:center}
.tabs button i{font-style:normal;width:1.55em;height:1.55em;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:#fff;font-size:.85em}
.tabs button[aria-current="page"]{background:#fff;color:var(--brand);box-shadow:0 0 0 3px var(--rc)}
.tabs button:not([aria-current]):hover{background:rgba(255,255,255,.2)}
#board{margin-left:auto}
.board4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:min(100%,660px)}
.team{background:#fff;color:var(--ink);border-radius:14px;padding:6px 10px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;border-left:8px solid var(--tc);position:relative}
.team .nm{font-weight:800;font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tc)}
.team .sc{grid-row:span 3;font-family:var(--display);font-weight:900;font-size:2em;line-height:1;color:var(--tc);font-variant-numeric:tabular-nums}
.team .sub{font-size:.7em;color:var(--muted);font-weight:600}
.team .adj{display:flex;gap:4px}
.team .adj button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:0 7px;font-size:.72em;line-height:1.5}
.team.turn{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold);animation:turn 1.4s ease-in-out infinite}
@keyframes turn{50%{box-shadow:0 0 0 4px var(--gold),0 0 30px var(--gold)}}
.team.bump .sc,.clsb.bump .cl-s{animation:bump .7s ease}
@keyframes bump{30%{transform:scale(1.45)}}
.team .star{position:absolute;right:6px;top:-9px;font-size:.78em;background:var(--gold);color:var(--brand);border-radius:8px;padding:0 6px;font-weight:800}
.clsb{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:16px;padding:6px 16px;font-weight:800}
.cl-l{font-size:.8em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cl-s{font:900 2.1em/1 var(--display);background:linear-gradient(90deg,#F26B3A,#E0457B,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:2ch;display:inline-block}
.okc{color:var(--ok)}.bdc{color:var(--bad)}
.clsb .okc,.clsb .bdc,.clsb .run{font-size:1.15em;border-radius:12px;padding:2px 10px}
.clsb .okc{background:var(--ok-bg)}.clsb .bdc{background:var(--bad-bg)}
.clsb .run{background:#FFEDD5;color:#C2410C;animation:bump 1s ease}

/* sân khấu */
.stage{flex:1;background:var(--stage);border-radius:22px;padding:clamp(14px,2vw,30px);border:1px solid var(--line);border-top:8px solid var(--rc);display:flex;flex-direction:column;gap:14px;min-height:0;box-shadow:0 10px 30px #1B2A6B14}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.rnum{font-family:var(--display);font-weight:900;color:#fff;background:linear-gradient(120deg,var(--rc),var(--rc2));border-radius:12px;padding:3px 14px;font-size:.95em;box-shadow:0 4px 12px color-mix(in srgb,var(--rc) 40%,transparent)}
.rhead h1{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.1vw,40px);margin:0;letter-spacing:-.01em;color:var(--rc)}
.rhead .rule{color:var(--muted);font-size:.9em;flex-basis:100%}
.qcount{margin-left:auto;font-weight:800;color:var(--rc);font-variant-numeric:tabular-nums}
.prog{width:clamp(120px,14vw,240px);height:12px;border-radius:8px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--rc),var(--rc2));border-radius:8px;transition:width .6s}
.qbox{font-size:clamp(20px,1.65vw,34px);line-height:1.5;font-weight:600;max-width:64ch;margin:0}
.qbox.sm{font-size:clamp(18px,1.4vw,28px);margin:0 0 8px}
.qbox.eq{margin:0 0 8px}
.qq{margin:0 0 8px;font-weight:800;font-size:1.05em;color:var(--rc)}
.ctx{color:var(--ink2);font-size:.95em;margin:0}

/* phương án */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid color-mix(in srgb,var(--oc) 40%,#fff);border-radius:16px;padding:12px 16px;font-size:clamp(17px,1.35vw,28px);
  background:color-mix(in srgb,var(--oc) 8%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--oc) 30%,#fff);min-width:0;transition:transform .15s,box-shadow .15s;position:relative}
button.opt:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 7px 0 color-mix(in srgb,var(--oc) 40%,#fff)}
button.opt:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--oc) 40%,#fff)}
button.opt:disabled{cursor:default}
.opt .lt{flex:none;width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;background:var(--oc);box-shadow:0 3px 0 color-mix(in srgb,var(--oc) 60%,#000)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 0 0 5px #16A34A33;animation:glow 1.3s ease 2}
.opt.right .lt{background:var(--ok)}
.opt.right::after{content:'✔';position:absolute;right:12px;top:6px;font-size:1.3em;color:var(--ok);font-weight:900}
@keyframes glow{50%{box-shadow:0 0 0 12px #16A34A22}}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.72;box-shadow:none}
.opt.wrong .lt{background:var(--bad)}
.opt.wrong::after{content:'✘';position:absolute;right:12px;top:6px;font-size:1.3em;color:var(--bad);font-weight:900}
.opt.dim{opacity:.38;box-shadow:none}
.opt .who{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.opt .ot{min-width:0}
.chip{border-radius:20px;padding:0 9px;font-size:.6em;font-weight:800;color:#fff;background:var(--tc);white-space:nowrap}
.why{border-left:6px solid var(--ok);background:var(--ok-bg);border-radius:0 14px 14px 0;padding:10px 16px;font-size:clamp(16px,1.2vw,24px);animation:slidein .5s ease}
.why b.h{color:var(--ok)}
.why.ask{border-left-color:var(--gold);background:#FEF9C3}.why.ask b.h{color:#A16207}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}}

/* thẻ chọn của các đội */
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pk{border:3px solid var(--tc);border-radius:14px;padding:6px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:color-mix(in srgb,var(--tc) 6%,#fff)}
.pk .tn{font-weight:800;color:var(--tc);font-size:.85em;margin-right:auto}
.pk button{width:2.1em;height:2.1em;border-radius:50%;border:2px solid color-mix(in srgb,var(--oc) 50%,#fff);background:#fff;font-family:var(--display);font-weight:900;font-size:.85em;color:var(--oc)}
.pk button[aria-pressed="true"]{background:var(--oc);border-color:var(--oc);color:#fff;transform:scale(1.1)}
.pk.ok{background:var(--ok-bg)}.pk.no{background:var(--bad-bg)}

/* điều khiển */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #1B2A6B10}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:800}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:linear-gradient(120deg,#1B2A6B,#4B2A8C);border-color:transparent;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--brand)}
.btn.call{background:linear-gradient(120deg,#F26B3A,#E0457B);border-color:transparent;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.timer{font-family:var(--display);font-weight:900;font-size:1.6em;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center;color:var(--brand)}
.timer.low{color:var(--bad);animation:bump .5s infinite}
.sp{flex:1}
.hint{color:var(--muted);font-size:.85em;margin:0}

/* bảng số liệu */
.dtw{overflow-x:auto}
.dt{border-collapse:separate;border-spacing:0;font-size:clamp(17px,1.35vw,28px);font-variant-numeric:tabular-nums;border-radius:14px;overflow:hidden;border:2px solid color-mix(in srgb,var(--rc) 35%,#fff)}
.dt th,.dt td{padding:6px 18px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.dt th{background:color-mix(in srgb,var(--rc) 14%,#fff);font-weight:700;color:var(--ink)}
.dt tr:nth-child(even) td{background:color-mix(in srgb,var(--rc) 4%,#fff)}
.v3{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:22px;align-items:start}
.v3 .opts{grid-template-columns:minmax(0,1fr)}
.v3.nt{grid-template-columns:minmax(0,1fr)}.v3.nt .opts{grid-template-columns:repeat(2,minmax(0,1fr))}

/* vòng 2: lật thẻ, hai phía hai màu */
.mem2{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}
.side{border-radius:20px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.side.sL{background:linear-gradient(180deg,#FFE9DC,#FFF6EF)}.side.sR{background:linear-gradient(180deg,#DFEBFF,#F1F7FF)}
.side h3{margin:0;font:800 1em var(--display)}.side.sL h3{color:var(--cL)}.side.sR h3{color:var(--cR)}
.side .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1}
.card{position:relative;border:0;border-radius:16px;min-height:clamp(84px,9.5vh,150px);padding:0;background:transparent;perspective:900px}
.card .in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:grid;place-items:center;padding:8px 10px;text-align:center}
.card .b{color:#fff;font-family:var(--display);font-weight:900;font-size:clamp(26px,2.6vw,48px);text-shadow:0 3px 0 #0003;box-shadow:0 5px 0 #0002}
.card.sL .b{background:radial-gradient(circle at 20% 20%,#ffffff33 0 10%,transparent 11%) 0 0/28px 28px,linear-gradient(135deg,var(--cL2),var(--cL) 60%,#E0457B)}
.card.sR .b{background:radial-gradient(circle at 20% 20%,#ffffff33 0 10%,transparent 11%) 0 0/28px 28px,linear-gradient(135deg,var(--cR2),var(--cR) 60%,#5B5BF0)}
.card:not(.up):hover .b{filter:brightness(1.08);transform:translateY(-2px)}
.card .f{transform:rotateY(180deg);border:3px solid var(--kc);font-size:clamp(14px,1.18vw,24px);padding-top:18px;line-height:1.35;overflow:hidden}
.card.sL{--kc:var(--cL)}.card.sR{--kc:var(--cR)}
.card.sL .f{background:#FFF5EE}.card.sR .f{background:#F0F6FF}
.card .f .tag{position:absolute;left:8px;top:4px;font:900 .75em var(--display);color:#fff;background:var(--kc);border-radius:8px;padding:0 7px}
.card.done .f{border-color:var(--ok);box-shadow:inset 0 0 0 3px #16A34A44}
.card.done .f::before{content:'✔';position:absolute;right:8px;top:2px;color:var(--ok);font-weight:900}
.card.done .f::after{content:attr(data-team);position:absolute;right:8px;bottom:4px;font-size:.62em;font-weight:800;color:#fff;background:var(--tc);border-radius:10px;padding:0 8px}
.card.done:not([data-team]) .f::after{display:none}
.card.miss .f{background:var(--bad-bg);border-color:var(--bad)}
.card.pulse .in{animation:pulse .8s ease}
@keyframes pulse{40%{transform:rotateY(180deg) scale(1.08)}}
.card .f mjx-container>svg{max-width:100%;height:auto}
.card .f.sm{font-size:clamp(12px,.88vw,18px)}

/* vòng 3: phân nhóm */
.pnq{color:var(--rc)}
.pnw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:16px;flex:1;align-items:stretch}
.bin{border-radius:22px;padding:12px;min-height:42vh;display:flex;flex-direction:column;gap:8px;border:3px dashed;text-align:left;transition:transform .2s}
.bin.b0{background:linear-gradient(180deg,#FFE4D6,#FFF6F0);border-color:var(--cL)}
.bin.b1{background:linear-gradient(180deg,#DCE9FF,#F2F7FF);border-color:var(--cR)}
.bin:not([aria-disabled]):hover{transform:scale(1.015)}
.bin .bh{display:block;text-align:center;color:#fff;border-radius:14px;padding:8px 10px;font:800 clamp(17px,1.35vw,26px)/1.3 var(--display)}
.bin.b0 .bh{background:linear-gradient(120deg,var(--cL2),var(--cL))}.bin.b1 .bh{background:linear-gradient(120deg,var(--cR2),var(--cR))}
.bin .drop{display:block;text-align:center;font-weight:800;min-height:1.4em;animation:bump 1s infinite}
.bin.b0 .drop{color:var(--cL)}.bin.b1 .drop{color:var(--cR)}
.placed{display:flex;gap:6px;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:6px 10px;font-size:clamp(14px,1vw,20px);animation:slidein .5s ease}
.bin.b0 .placed{border-left:6px solid var(--cL)}.bin.b1 .placed{border-left:6px solid var(--cR)}
.pile{display:flex;flex-direction:column;gap:8px;justify-content:center}
.itm{border:2px solid #CBD0E6;background:#fff;border-radius:14px;padding:10px 14px;font-size:clamp(15px,1.15vw,23px);text-align:left;box-shadow:0 4px 0 #CBD0E6;transition:transform .15s}
.itm:hover{transform:translateY(-2px)}
.itm.sel{border-color:#8B5CF6;background:#F3EEFF;box-shadow:0 0 0 5px #8B5CF655;transform:scale(1.03)}

/* vòng 5: đồ thị */
.v4{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.plotw{border:2px solid color-mix(in srgb,var(--rc) 25%,#fff);border-radius:16px;padding:10px 12px;background:#FBFCFF}
.plotw>svg{width:100%;height:auto;display:block;max-height:38vh}
.axl{display:flex;justify-content:space-between;gap:10px;font-size:clamp(14px,1.05vw,20px);color:var(--ink2);margin-top:4px}
.v4 .opts{grid-template-columns:minmax(0,1fr)}
.v4 .opt{font-size:clamp(15px,1.12vw,23px);padding:8px 12px}
.v4 .opts.g{grid-template-columns:repeat(2,minmax(0,1fr))}.v4 .opts.g .opt{flex-wrap:wrap;padding:6px 8px;gap:6px;align-items:flex-start}
.v4 .opts.g .ot{flex:1 1 70%;min-width:0}.mini{width:100%;height:auto;display:block;max-height:15vh}

/* vòng 6 */
.steps{display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-left:8px solid var(--oc,var(--line));border-radius:14px;padding:8px 14px;background:#fff;text-align:left;font-size:clamp(16px,1.25vw,26px);width:100%;transition:transform .15s}
.step:not(:disabled):hover{transform:translateX(4px)}
.step .lt{flex:none;width:1.9em;height:1.9em;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--oc,#888) 18%,#fff);color:var(--ink);font-family:var(--display);font-weight:900}
.step .no{margin-left:auto;flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-family:var(--display);font-weight:900;animation:bump .4s}
.step .no.gr{background:var(--muted)}
.step.on{background:#F3EEFF}
.step.ok{border-color:var(--ok);background:var(--ok-bg)}
.step.ln{border-left-color:var(--rc)}
.step.badl{border-color:var(--bad);background:var(--bad-bg)}
.step.wl{opacity:.5;text-decoration:line-through;text-decoration-color:var(--bad)}
.buzz{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.buzz button{border:3px solid var(--tc);background:#fff;border-radius:12px;padding:6px 14px;font-weight:800;color:var(--tc)}
.buzz button[aria-pressed="true"]{background:var(--tc);color:#fff}
.buzz button.tried{opacity:.45}
.banner{border-radius:14px;padding:10px 16px;font-weight:800;font-size:clamp(17px,1.3vw,26px);animation:slidein .5s ease}
.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.bad{background:var(--bad-bg);color:var(--bad)}

/* trang chủ */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(38px,4vw,72px);line-height:1;margin:0 0 12px;color:var(--brand);letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,#F26B3A,#E0457B,#8B5CF6,#2F7DE1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 12px;max-width:62ch;color:var(--ink2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.modes button{border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);transition:transform .15s}
.modes button:hover{transform:translateY(-2px)}
.modes .me{font-size:1.8em;line-height:1.1}
.modes button b{font:900 1.2em var(--display)}.modes button span:not(.me){font-size:.8em;color:var(--muted)}

<script>
/* ================= HOẠT HÌNH MẶT CẮT THIẾT BỊ (SVG + SMIL) ================= */
let AID=0;
function srand(seed){let s=seed>>>0||1;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const f1=v=>(+v).toFixed(1);
const LQ='#4FA3E0',LQ2='#2E6FB8',HT='#F07B2A',CAT='#9A6A3A',GAS='#FFFFFF',INK='#14325C';
function defs5(id){return `<defs>
 <marker id="a${id}" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="${INK}"/></marker>
 <marker id="h${id}" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="${HT}"/></marker>
 <linearGradient id="m${id}" x1="0" x2="1"><stop offset="0" stop-color="#C9D3E2"/><stop offset=".5" stop-color="#F4F7FB"/><stop offset="1" stop-color="#9AA7BC"/></linearGradient>
 <linearGradient id="c${id}" x1="0" x2="1"><stop offset="0" stop-color="#3B8FE0"/><stop offset="1" stop-color="#8E44AD"/></linearGradient>
 <linearGradient id="v${id}" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#3B8FE0"/><stop offset="1" stop-color="#8E44AD"/></linearGradient>
 <radialGradient id="b${id}"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#D6ECFF" stop-opacity=".55"/></radialGradient></defs>`;}
const arr=(id,x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c==='h'?HT:INK}" stroke-width="3" marker-end="url(#${c==='h'?'h':'a'}${id})"/>`;
/* chấm chạy theo đường path */
const mover=(path,dur,begin,r,fill,extra='')=>`<circle r="${r}" fill="${fill}" ${extra}><animateMotion dur="${dur}s" begin="${begin}s" repeatCount="indefinite" path="${path}"/></circle>`;
/* cánh khuấy quay (nhìn ngang): co giãn theo phương ngang */
const impeller=(x,y,w,dur=.9)=>`<g transform="translate(${x},${y})"><g><rect x="${-w}" y="-5" width="${2*w}" height="10" rx="3" fill="${INK}"/><rect x="-4" y="-12" width="8" height="24" rx="2" fill="${INK}"/>
 <animateTransform attributeName="transform" type="scale" values="1 1;0.12 1;-1 1;0.12 1;1 1" dur="${dur}s" repeatCount="indefinite"/></g></g>`;
/* nhãn: chế độ 'lab' hiện chữ, chế độ 'mark' hiện số tròn ở điểm chỉ định */
function labels(L,opt){if(!L)return '';const show=opt.labels!==false;let s='';
  L.forEach((l,i)=>{if(opt.mark){if(opt.mark===l.k){s+=`<g class="mk"><circle cx="${l.x}" cy="${l.y}" r="15" fill="#FACC15" stroke="${INK}" stroke-width="3"><animate attributeName="r" values="13;17;13" dur="1.2s" repeatCount="indefinite"/></circle><text x="${l.x}" y="${l.y+6}" font-size="17" font-weight="900" text-anchor="middle" fill="${INK}">?</text></g>`;}return;}
    if(!show)return;const tx=l.tx??l.x,ty=l.ty??l.y,a=l.a||(tx<l.x?'end':'start');
    s+=`<g class="lb" style="animation-delay:${(0.4+i*0.3).toFixed(2)}s"><line x1="${l.x}" y1="${l.y}" x2="${tx}" y2="${ty}" stroke="${INK}" stroke-width="1.6"/><circle cx="${l.x}" cy="${l.y}" r="3.5" fill="${INK}"/>
     <text x="${tx+(a==='end'?-5:a==='start'?5:0)}" y="${ty+5}" font-size="15" font-weight="700" text-anchor="${a}" fill="${INK}" paint-order="stroke" stroke="#fff" stroke-width="4">${l.t}</text></g>`;});
  return s;}

/* ---- bình khuấy: kind = batch | cont | bio | heat ---- */
function aTank(id,o){const kind=o.kind||'cont',R=srand(7);let s='';
  const x0=120,x1=280,yT=70,yB=258;
  /* vỏ áo */
  s+=`<path d="M${x0-14},${yT+20} V${yB-22} Q${x0-14},${yB+14} 200,${yB+14} Q${x1+14},${yB+14} ${x1+14},${yB-22} V${yT+20}" fill="#FCD9BF" stroke="${HT}" stroke-width="3"/>`;
  s+=`<path d="M${x0-7},${yT+24} V${yB-22} Q${x0-7},${yB+7} 200,${yB+7} Q${x1+7},${yB+7} ${x1+7},${yB-22} V${yT+24}" fill="none" stroke="${HT}" stroke-width="5" stroke-dasharray="10 12" opacity=".75"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.4s" repeatCount="indefinite"/></path>`;
  s+=arr(id,x1+60,yB-6,x1+16,yB-6,'h')+arr(id,x0-16,yT+28,x0-60,yT+28,'h');
  /* thân bình */
  s+=`<path d="M${x0},${yT} V${yB-24} Q${x0},${yB} 200,${yB} Q${x1},${yB} ${x1},${yB-24} V${yT}" fill="#fff" stroke="${INK}" stroke-width="3"/>`;
  const liq=`M${x0+3},${yT+28} V${yB-24} Q${x0+3},${yB-3} 200,${yB-3} Q${x1-3},${yB-3} ${x1-3},${yB-24} V${yT+28} Z`;
  if(kind==='batch')s+=`<path d="${liq}" fill="${LQ}"><animate attributeName="fill" values="#3B8FE0;#6C5CD6;#8E44AD;#8E44AD;#3B8FE0" keyTimes="0;.45;.8;.97;1" dur="12s" repeatCount="indefinite"/></path>`;
  else s+=`<path d="${liq}" fill="${kind==='bio'?'#7FBF6A':'#7E64D0'}"/>`;
  s+=`<rect x="${x0-6}" y="${yT-10}" width="${x1-x0+12}" height="12" rx="3" fill="url(#m${id})" stroke="${INK}" stroke-width="2"/>`;
  /* ống xoắn trong */
  if(kind!=='bio')for(let y=yT+60;y<=yB-50;y+=22){s+=`<circle cx="${x0+16}" cy="${y}" r="6" fill="${HT}" stroke="#9A3412" stroke-width="1.5"/><circle cx="${x1-16}" cy="${y}" r="6" fill="${HT}" stroke="#9A3412" stroke-width="1.5"/>`;}
  /* dòng tuần hoàn do cánh khuấy */
  const yi=yB-58;
  for(let k=0;k<16;k++){const left=k%2,cx=left?160:240,p=left?`M200,${yi} C${x0+10},${yi+10} ${x0+10},${yT+50} 170,${yT+50} C200,${yT+50} 205,${yi-30} 200,${yi}`:`M200,${yi} C${x1-10},${yi+10} ${x1-10},${yT+50} 230,${yT+50} C200,${yT+50} 195,${yi-30} 200,${yi}`;
    s+=mover(p,3.2,-(k*0.4),3.2,kind==='bio'?'#2F6B1F':'#fff','opacity=".85"');}
  if(kind==='bio'){for(let k=0;k<14;k++){const x=175+R()*50;s+=`<circle cx="${f1(x)}" cy="${yB-20}" r="${f1(2.5+R()*3)}" fill="url(#b${id})" stroke="#fff"><animate attributeName="cy" from="${yB-20}" to="${yT+30}" dur="${f1(2.4+R())}s" begin="-${f1(R()*3)}s" repeatCount="indefinite"/><animate attributeName="cx" values="${f1(x)};${f1(x+(R()-.5)*60)};${f1(x+(R()-.5)*80)}" dur="${f1(2.4+R())}s" begin="-${f1(R()*3)}s" repeatCount="indefinite"/></circle>`;}
    s+=`<path d="M175,${yB-18} H225" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M175,${yB-18} V${yB+30} H130" fill="none" stroke="${INK}" stroke-width="3"/>`+arr(id,90,yB+30,128,yB+30);}
  /* trục, động cơ, cánh khuấy */
  s+=`<rect x="186" y="${yT-44}" width="28" height="26" rx="4" fill="#5B6B86" stroke="${INK}" stroke-width="2"/><line x1="200" y1="${yT-18}" x2="200" y2="${yi}" stroke="${INK}" stroke-width="5"/>`;
  s+=impeller(200,yi,40)+impeller(200,yT+70,30,1.1);
  /* dòng vào / ra */
  if(kind==='cont'||kind==='heat'){s+=`<path d="M60,${yT-28} H150 V${yT+40}" fill="none" stroke="#3B8FE0" stroke-width="7"/><path d="M60,${yT-28} H150 V${yT+40}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".8s" repeatCount="indefinite"/></path>`;
    s+=`<path d="M200,${yB} V${yB+26} H340" fill="none" stroke="#7E64D0" stroke-width="7"/><path d="M200,${yB} V${yB+26} H340" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur=".8s" repeatCount="indefinite"/></path>`+arr(id,330,yB+26,356,yB+26);}
  if(kind==='batch')s+=`<g font-size="15" font-weight="800" fill="${INK}"><text x="200" y="${yB+46}" text-anchor="middle">Nạp liệu lúc đầu · tháo sản phẩm lúc cuối</text></g>`;
  const L=[{k:'motor',x:200,y:yT-31,tx:250,ty:yT-40,t:'Động cơ'},{k:'imp',x:232,y:yi,tx:330,ty:yi-20,t:'Cánh khuấy'},{k:'shaft',x:200,y:yT+20,tx:250,ty:yT+8,t:'Trục khuấy'},
   {k:'jacket',x:x0-10,y:yB-60,tx:40,ty:yB-80,t:'Vỏ áo'}];
  if(kind!=='bio')L.push({k:'coil',x:x1-16,y:yT+82,tx:345,ty:yT+60,t:'Ống xoắn'});
  if(kind==='cont'||kind==='heat'){L.push({k:'in',x:90,y:yT-28,tx:60,ty:yT-46,t:'Tác chất vào',a:'start'},{k:'out',x:300,y:yB+26,tx:300,ty:yB+46,t:'Sản phẩm ra',a:'middle'});}
  if(kind==='bio')L.push({k:'sparger',x:200,y:yB-18,tx:60,ty:yB+10,t:'Ống sục khí'});
  L.push({k:'htin',x:x1+40,y:yB-6,tx:x1+40,ty:yB+18,t:'Tác nhân nhiệt',a:'middle'});
  return {s,L,vb:'0 0 400 310'};}

/* ---- bình khuấy nối tiếp ---- */
function aSeries(id){let s='';const C=['#4C7FE0','#6A62D6','#8350C8'];
  s+=`<path d="M10,70 H40 V95" fill="none" stroke="#3B8FE0" stroke-width="6"/>`;
  [0,1,2].forEach(i=>{const x=40+i*120;s+=`<path d="M${x},80 V190 Q${x},215 ${x+40},215 Q${x+80},215 ${x+80},190 V80" fill="#fff" stroke="${INK}" stroke-width="3"/>
   <path d="M${x+3},105 V190 Q${x+3},212 ${x+40},212 Q${x+77},212 ${x+77},190 V105Z" fill="${C[i]}"/><line x1="${x+40}" y1="55" x2="${x+40}" y2="180" stroke="${INK}" stroke-width="4"/><rect x="${x+30}" y="42" width="20" height="16" rx="3" fill="#5B6B86"/>`+impeller(x+40,180,24,.8);
   for(let k=0;k<6;k++)s+=mover(`M${x+40},180 C${x+8},185 ${x+8},120 ${x+30},118 C${x+40},118 ${x+44},160 ${x+40},180`,2.4,-k*.4,2.6,'#fff');
   s+=`<text x="${x+40}" y="245" font-size="16" font-weight="800" text-anchor="middle" fill="${INK}">Bình ${i+1}</text>`;
   if(i<2)s+=`<path d="M${x+40},215 V228 H${x+105} V100 H${x+120}" fill="none" stroke="${C[i]}" stroke-width="6"/>`+mover(`M${x+40},215 V228 H${x+105} V100 H${x+120}`,2,0,3,'#fff')+mover(`M${x+40},215 V228 H${x+105} V100 H${x+120}`,2,-1,3,'#fff');});
  s+=`<path d="M320,215 V228 H390" fill="none" stroke="${C[2]}" stroke-width="6"/>`+arr(id,375,228,398,228);
  s+=`<text x="200" y="292" font-size="15" font-weight="700" text-anchor="middle" fill="${INK}">Nồng độ tác chất giảm theo từng bậc: C<tspan baseline-shift="sub" font-size="70%">A1</tspan> &gt; C<tspan baseline-shift="sub" font-size="70%">A2</tspan> &gt; C<tspan baseline-shift="sub" font-size="70%">A3</tspan></text>`;
  return {s,L:[{k:'in',x:20,y:70,tx:14,ty:50,t:'Tác chất vào',a:'start'},{k:'link',x:145,y:228,tx:200,ty:264,t:'Dòng ra bình 1 = dòng vào bình 2',a:'middle'}],vb:'0 0 400 305'};}

/* ---- bình ống: mode = ideal | real | zigzag ---- */
function aPipe(id,o){const mode=o.mode||'ideal',R=srand(3);let s='';
  if(mode==='zigzag'){const p='M20,60 H330 Q370,60 370,100 Q370,140 330,140 H70 Q30,140 30,180 Q30,220 70,220 H380';
    s+=`<path d="${p}" fill="none" stroke="${INK}" stroke-width="30" stroke-linecap="round"/><path d="${p}" fill="none" stroke="url(#c${id})" stroke-width="22"/>`;
    for(let k=0;k<22;k++)s+=mover(p,7,-k*7/22,4,'#fff');
    s+=arr(id,4,60,24,60)+arr(id,378,220,398,220);
    return {s,L:[{k:'in',x:24,y:60,tx:24,ty:30,t:'Tác chất vào',a:'start'},{k:'bend',x:370,y:100,tx:300,ty:30,t:'Ghép ống zic zắc (co nối)',a:'middle'},{k:'out',x:370,y:220,tx:330,ty:260,t:'Sản phẩm ra',a:'middle'}],vb:'0 0 400 290'};}
  const xa=40,xb=360,yo1=95,yo2=205,yi1=122,yi2=178;
  s+=`<rect x="${xa}" y="${yo1}" width="${xb-xa}" height="${yo2-yo1}" rx="8" fill="#FDE3CF" stroke="${INK}" stroke-width="3"/>`;
  for(let k=0;k<18;k++){const yy=k%2?yo1+12:yo2-12;s+=`<circle r="3.5" fill="${HT}" cy="${yy}"><animate attributeName="cx" from="${xb-10}" to="${xa+10}" dur="5s" begin="-${f1(k*5/18)}s" repeatCount="indefinite"/></circle>`;}
  s+=`<rect x="${xa-20}" y="${yi1}" width="${xb-xa+40}" height="${yi2-yi1}" fill="url(#c${id})" stroke="${INK}" stroke-width="3"/>`;
  if(mode==='ideal'){for(let k=0;k<9;k++)s+=`<line y1="${yi1+3}" y2="${yi2-3}" stroke="#fff" stroke-width="4" opacity=".9"><animate attributeName="x1" from="${xa-15}" to="${xb+15}" dur="6s" begin="-${f1(k*6/9)}s" repeatCount="indefinite"/><animate attributeName="x2" from="${xa-15}" to="${xb+15}" dur="6s" begin="-${f1(k*6/9)}s" repeatCount="indefinite"/></line>`;}
  else{const rows=7;for(let r=0;r<rows;r++){const yy=yi1+6+r*(yi2-yi1-12)/(rows-1),u=1-((yy-(yi1+yi2)/2)/((yi2-yi1)/2))**2,d=Math.max(2.2,6/(0.25+u));
      for(let k=0;k<5;k++)s+=`<circle r="3" fill="#fff" cy="${f1(yy)}"><animate attributeName="cx" from="${xa-15}" to="${xb+15}" dur="${f1(d)}s" begin="-${f1(k*d/5)}s" repeatCount="indefinite"/></circle>`;}
    s+=`<path d="M${xa+60},${yi1+3} q40,27 0,53" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 4"/><path d="M${xa+220},${yi1+3} q40,27 0,53" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 4"/>`;}
  s+=arr(id,4,150,xa-22,150)+arr(id,xb+22,150,396,150)+arr(id,xb+30,yo2+25,xb-6,yo2+25,'h')+arr(id,xa+6,yo1-22,xa-30,yo1-22,'h');
  s+=`<path d="M${xb-20},${yo2} V${yo2+25} H${xb+30}" fill="none" stroke="${HT}" stroke-width="4"/><path d="M${xa+20},${yo1} V${yo1-22} H${xa-30}" fill="none" stroke="${HT}" stroke-width="4"/>`;

/* ---- tháp mâm (chóp) ---- */
function aTray(id){const R=srand(4);let s='';const x0=140,x1=260,yT=30,yB=282,trays=[78,126,174,222],W=12;
  s+=`<rect x="${x0}" y="${yT}" width="${x1-x0}" height="${yB-yT}" rx="12" fill="#F4F8FC" stroke="${INK}" stroke-width="3"/>`;
  s+=`<path d="M${x0+2},${yB-22} H${x1-2} V${yB-10} Q200,${yB} ${x0+2},${yB-10}Z" fill="${LQ}" opacity=".7"/>`;
  let P=`M${x0-40},62 H${x0+8} V${trays[0]-6}`;
  trays.forEach((y,i)=>{const R2=i%2===0,dx=R2?x1-22:x0+22,yn=i<3?trays[i+1]:yB-14;
    /* lớp lỏng trên mâm (cao bằng gờ) */
    s+=`<rect x="${R2?x0+2:x0+24}" y="${y-W}" width="${x1-x0-26}" height="${W}" fill="${LQ}" opacity=".85"><animate attributeName="opacity" values=".7;.95;.7" dur="1.6s" repeatCount="indefinite"/></rect>`;
    /* chất lỏng trong ống chảy chuyền */
    s+=`<rect x="${R2?dx+1:x0+2}" y="${y-2}" width="${R2?x1-dx-3:dx-x0-3}" height="${yn-y-6}" fill="${LQ}" opacity=".45"/>`;
    /* mâm + gờ chảy tràn + vách ống chảy chuyền */
    s+=`<line x1="${R2?x0:x0+22}" y1="${y}" x2="${R2?x1-22:x1}" y2="${y}" stroke="${INK}" stroke-width="4"/>`;
    s+=`<line x1="${dx}" y1="${y-W-2}" x2="${dx}" y2="${Math.min(y+34,yB-18)}" stroke="${INK}" stroke-width="3"/><rect x="${dx-2.5}" y="${y-W-3}" width="5" height="${W+3}" fill="#B45309"/>`;
    for(let c=0;c<3;c++){const cx=(R2?x0+22:x0+48)+c*26;s+=`<path d="M${cx-9},${y-3} V${y-9} Q${cx},${y-18} ${cx+9},${y-9} V${y-3}" fill="#5B6B86" stroke="${INK}" stroke-width="1.5"/>`;
      for(let b=0;b<3;b++)s+=`<circle cx="${cx-8+b*8}" r="2.4" fill="#fff"><animate attributeName="cy" from="${y-5}" to="${y-W-6}" dur="${f1(.6+R()*.5)}s" begin="-${f1(R())}s" repeatCount="indefinite"/></circle>`;
      s+=`<circle cx="${cx}" r="2" fill="#9AA7BC"><animate attributeName="cy" from="${y-W-6}" to="${y-48}" dur="${f1(1.4+R())}s" begin="-${f1(R()*2)}s" repeatCount="indefinite"/></circle>`;}
    /* đường đi của lỏng: ngang qua mâm → tràn qua gờ → rơi xuống ống chảy chuyền → mâm dưới */
    if(R2)P+=` L${x1-32},${y-6} Q${dx},${y-W-12} ${dx+8},${y-6} V${yn-6}`;
    else P+=` L${x0+32},${y-6} Q${dx},${y-W-12} ${dx-8},${y-6} V${yn-6}`;
    if(i<3)P+=R2?` L${x1-12},${yn-6}`:` L${x0+12},${yn-6}`;});
  P+=` H${x1-6} H${x1+44}`;
  s+=`<path d="${P}" fill="none" stroke="#1D5FA8" stroke-width="1.2" stroke-dasharray="3 5" opacity=".55"/>`;
  for(let k=0;k<30;k++)s+=mover(P,13,-k*13/30,3.2,'#1D5FA8','stroke="#fff" stroke-width="1"');
  s+=arr(id,60,62,x0-4,62)+`<path d="M60,62 H${x0}" stroke="#2E86DE" stroke-width="4"/>`+arr(id,60,yB-36,x0-4,yB-36)+arr(id,200,yT-2,200,yT-26)+arr(id,x1+4,yB-14,x1+60,yB-14);
  const L=[{k:'weir',x:x1-22,y:trays[0]-W-2,tx:330,ty:trays[0]-34,t:'Gờ chảy tràn'},{k:'cap',x:x0+74,y:trays[1]-14,tx:330,ty:trays[1]-12,t:'Chóp trên mâm'},{k:'tray',x:x1-60,y:trays[2],tx:330,ty:trays[2]+4,t:'Mâm'},

    {k:'lin',x:80,y:62,tx:40,ty:44,t:'Lỏng vào',a:'start'},{k:'gin',x:80,y:yB-36,tx:40,ty:yB-54,t:'Khí vào',a:'start'},{k:'gout',x:200,y:yT-16,tx:240,ty:yT-18,t:'Khí ra'},{k:'lout',x:x1+40,y:yB-14,tx:x1+40,ty:yB+6,t:'Lỏng ra',a:'middle'}];
  return {s,L,vb:'0 0 400 305'};}

function animSVG(name,opt={}){const id='z'+(++AID),g=ANIM[name](id),k=opt.speed||SPEED;
  const [,,w,h]=g.vb.split(' ').map(Number);
  const body=(g.s).replace(/(dur|begin)="(-?[\d.]+)s"/g,(m,a,v)=>`${a}="${(+v*k).toFixed(2)}s"`);
  const vb=opt.tight?`30 0 ${w-60} ${h}`:`-110 0 ${w+220} ${h}`;
  return `<svg class="anim" viewBox="${vb}" role="img" aria-label="Hoạt hình mặt cắt thiết bị">${defs5(id)}${body}${labels(g.L,opt)}</svg>`;}
function animLabel(name,k){const g=ANIM[name]('tmp');const l=g.L.find(x=>x.k===k);return l?l.t:'';}

  if(m.anim)return `<figure class="mf animf">${animSVG(m.anim,{mark:opt.mark||m.mark,labels:opt.labels??m.labels})}${opt.cap===false||!m.cap?'':`<figcaption>${m.cap}</figcaption>`}</figure>`;
  const I=IMG[m.img],kb=m.kb||[0,0,1,0,0,1.12];
  const marks=(opt.marks??m.marks??[]).map(k=>`<span class="pm" style="left:${k[0]}%;top:${k[1]}%">${k[2]??'?'}</span>`).join('');
  return `<figure class="mf imgf"><div class="kbw" style="--bg:url('img/${m.img}.jpg')"><div class="kbi" style="aspect-ratio:${I[0]}/${I[1]};--x0:${kb[0]}%;--y0:${kb[1]}%;--s0:${kb[2]};--x1:${kb[3]}%;--y1:${kb[4]}%;--s1:${kb[5]};--d:${m.d||8}s">
   <img src="img/${m.img}.jpg" alt="${esc(I[2])}">${marks}</div></div>${opt.cap===false?'':`<figcaption>📷 ${opt.cap==='credit'?'':(m.cap||I[2])+' '}<span class="src">· ${esc(I[3])}, ${I[4]}</span></figcaption>`}</figure>`;}

/* ---------- đồ thị Levenspiel (hệ nhiều TBPU) ---------- */
const fmt=(v,d)=>String(+(+v).toFixed(d)).replace('.',',');
function levG(it,W,H,L,Rr,T,Bt){const A=it.ax,pw=W-L-Rr,ph=H-T-Bt;
  return {pw,ph,X:x=>L+(x-A.x0)/(A.x1-A.x0)*pw,Y:y=>H-Bt-Math.min(y,A.y1)/A.y1*ph};}
function crvF(fn,a,b,X,Y,n=90){const p=[];for(let k=0;k<=n;k++){const x=a+(b-a)*k/n;p.push([X(x),Y(fn(x))]);}return p;}
function shp(it,sh,X,Y){const fn=sh.f2?it.f2:it.f;if(sh.k==='R'){const y=Y(fn(sh.h));return `M${X(sh.a)},${Y(0)} V${y} H${X(sh.b)} V${Y(0)} Z`;}
  const p=crvF(fn,sh.a,sh.b,X,Y,60);return `M${X(sh.a)},${Y(0)} `+p.map(q=>'L'+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+` L${X(sh.b)},${Y(0)} Z`;}
const HC={b:'#2E86AB',o:'#E07A1F',r:'#D9344A',g:'#1E9E5A'},ANG={b:45,o:-45,r:-45,g:0};
function pat(id,c,ang){return `<pattern id="${id}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><rect width="9" height="9" fill="${c}" fill-opacity=".16"/><line x1="0" y1="0" x2="0" y2="9" stroke="${c}" stroke-width="2.4"/></pattern>`;}
const pdefs=pre=>Object.keys(HC).map(c=>pat(pre+c,HC[c],ANG[c])).join('');
const shSVG=(it,sh,X,Y,pre,sw)=>{const c=sh.c||'b';return `<path d="${shp(it,sh,X,Y)}" fill="url(#${pre}${c})" stroke="${HC[c]}" stroke-width="${c==='o'?sw*1.3:sw}" ${c==='o'?'stroke-dasharray="9 6"':''}/>`;};
function axes(W,H,L,Rr,T,Bt,sw){return `<line x1="${L}" y1="${H-Bt}" x2="${W-Rr}" y2="${H-Bt}" stroke="#13213A" stroke-width="${sw}"/><line x1="${L}" y1="${H-Bt}" x2="${L}" y2="${T}" stroke="#13213A" stroke-width="${sw}"/>
   <path d="M${W-Rr},${H-Bt} l-${3*sw},-${2*sw} v${4*sw}z M${L},${T} l-${2*sw},${3*sw} h${4*sw}z" fill="#13213A"/>`;}
const curves=(it,X,Y,n,sw)=>{let s=`<polyline points="${crvF(it.f,it.xmin||0,it.xmax,X,Y,n).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#14325C" stroke-width="${sw}" stroke-linejoin="round"/>`;
  if(it.f2)s+=`<polyline points="${crvF(it.f2,it.xmin||0,it.xmax,X,Y,n).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#D9344A" stroke-width="${sw}" stroke-linejoin="round"/>`;return s;};
function mini(it,g,k){const W=230,H=130,L=14,Rr=10,T=10,Bt=22,{X,Y}=levG(it,W,H,L,Rr,T,Bt),pre='m'+k,gs=Array.isArray(g)?g:[g];
  return `<svg class="mini" viewBox="0 0 ${W} ${H}" role="img" aria-label="Phương án ${LET[k]}"><defs>${pdefs(pre)}</defs>
   ${gs.map(sh=>shSVG(it,sh,X,Y,pre,2)).join('')}${axes(W,H,L,Rr,T,Bt,1.6)}${curves(it,X,Y,90,3)}
   ${it.ax.xt.map(x=>`<text x="${X(x)}" y="${H-5}" font-size="12" text-anchor="middle" fill="#3A4A63">${fmt(x,it.ax.xf)}</text>`).join('')}</svg>`;}
function drawLev(it,t){const svg=$('#plot');if(!svg)return;const W=600,H=340,L=60,Rr=18,T=16,Bt=40,A=it.ax,{X,Y,pw}=levG(it,W,H,L,Rr,T,Bt);
  let s=`<defs>${pdefs('p')}<clipPath id="cpl"><rect x="${L}" y="0" width="${Math.max(0,pw*t).toFixed(1)}" height="${H}"/></clipPath></defs>`;
  s+=(A.yt||[]).map(y=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(y)}" y2="${Y(y)}" stroke="#DCE3EE" stroke-width="1"/><text x="${L-8}" y="${Y(y)+6}" font-size="17" text-anchor="end" fill="#3A4A63">${fmt(y,0)}</text>`).join('');
  s+=A.xt.map(x=>`<text x="${X(x)}" y="${H-12}" font-size="17" text-anchor="middle" fill="#3A4A63">${fmt(x,A.xf)}</text>`).join('');
  s+=(it.pre||[]).map(sh=>shSVG(it,sh,X,Y,'p',2.5)).join('');
  if(t>0)s+=`<g clip-path="url(#cpl)">${it.shade.map(sh=>shSVG(it,sh,X,Y,'p',2.5)).join('')}</g>`;
  s+=axes(W,H,L,Rr,T,Bt,2.5)+curves(it,X,Y,160,4);
  if(it.f2){const xe=it.xmax-0.04;s+=`<text x="${X(xe)-8}" y="${Y(it.f(xe))-8}" font-size="20" font-weight="800" fill="#14325C" text-anchor="end">(1)</text><text x="${X(xe)+4}" y="${Y(it.f2(xe))+24}" font-size="20" font-weight="800" fill="#D9344A">(2)</text>`;}
  s+=it.pts.map(x=>`<circle cx="${X(x).toFixed(1)}" cy="${Y(it.f(x)).toFixed(1)}" r="6" fill="#fff" stroke="#14325C" stroke-width="3"/>`).join('');
  [].concat(it.guide??[]).forEach(g=>{const y=it.f(g);s+=`<path d="M${X(g)},${Y(0)} V${Y(y)} H${L}" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="${X(g)}" cy="${Y(y)}" r="6" fill="#7C3AED"/>`;});
  if(t>=1&&it.leg){let x=L+20;s+=`<g font-size="18" font-weight="700">`+it.leg.map(([c,lb])=>{const g=`<rect x="${x}" y="${T+4}" width="22" height="16" fill="url(#p${c})" stroke="${HC[c]}" stroke-width="2.5" ${c==='o'?'stroke-dasharray="5 3"':''}/><text x="${x+28}" y="${T+18}" fill="#14325C">${lb}</text>`;x+=40+lb.length*10;return g;}).join('')+'</g>';}
  svg.innerHTML=s;}

function norm(a){const o=[];let need=true;a.forEach(e=>{if(typeof e==='string'){if(need){o.push(e);need=false;}else o[o.length-1]+=e;}else{if(need)o.push('');o.push(e);need=true;}});if(need)o.push('');return o;}
function chainS(a,x0,cy){const q=norm(a);let x=x0,s='';q.forEach((e,i)=>{if(typeof e==='string'){const L=Math.max(i===0||i===q.length-1?50:44,tw(e)+18);s+=arrow(x,x+L,cy,e);x+=L;}else{const u=(e.k==='k'?unitK:unitO)(x,cy,e.v);s+=u.s;x+=u.w;}});return {s,w:x-x0};}
function sysSVG(sp){SID++;let s='',W,H;
  if(sp.par){const cy=136,d=70,Li=Math.max(50,tw(sp.i||'')+18),xs=6+Li,r1=chainS(sp.par[0],xs,cy-d),r2=chainS(sp.par[1],xs,cy+d),xe=xs+Math.max(r1.w,r2.w),Lo=Math.max(50,tw(sp.o||'')+18);
    s=arrow(6,xs,cy,sp.i||'')+`<line x1="${xs}" y1="${cy-d}" x2="${xs}" y2="${cy+d}" stroke="#14325C" stroke-width="2.6"/>`+r1.s+r2.s
     +[r1,r2].map((r,k)=>r.w<xe-xs?`<line x1="${xs+r.w}" y1="${cy+(k?d:-d)}" x2="${xe}" y2="${cy+(k?d:-d)}" stroke="#14325C" stroke-width="2.6"/>`:'').join('')
     +`<line x1="${xe}" y1="${cy-d}" x2="${xe}" y2="${cy+d}" stroke="#14325C" stroke-width="2.6"/>`+arrow(xe,xe+Lo,cy,sp.o||'');W=xe+Lo+14;H=282;}
